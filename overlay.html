<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calzadilla Live Overlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@font-face {
  font-family: "Bigail";
  src: url("Bigail.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
}

#overlay {
  position: absolute;
  left: 20px;
  top: 20px;

  width: 746px;
  height: 283px;

  font-family: "Bigail", Arial, sans-serif;
}

#scoreboardArt {
  position: absolute;
  inset: 0;

  width: 746px;
  height: 283px;

  pointer-events: none;
  z-index: 1;
}


/* =============================
   TOP / BOTTOM
============================= */

#half {
  position: absolute;

  left: 322px;
  top: 76px;

  width: 55px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #10266f;

  font-size: 17px;
  font-weight: normal;

  z-index: 10;
}


/* =============================
   INNING
============================= */

#inning {
  position: absolute;

  left: 433px;
  top: 69px;

  width: 53px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 24px;

  z-index: 10;
}


/* =============================
   COUNT
============================= */

#count {
  position: absolute;

  left: 494px;
  top: 76px;

  width: 55px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  color: #10266f;

  font-size: 17px;

  z-index: 10;
}


/* =============================
   TEAM NAMES
============================= */

.team-name {
  position: absolute;

  width: 112px;
  height: 30px;

  display: flex;
  align-items: center;

  padding-left: 9px;

  color: white;

  font-size: 14px;

  text-transform: uppercase;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  z-index: 10;
}

#awayName {
  left: 311px;
  top: 136px;
}

#homeName {
  left: 311px;
  top: 178px;
}


/* =============================
   SCORE DIGITS

   LEFT = tens
   RIGHT = units
============================= */

.score-digit {
  position: absolute;

  width: 32px;
  height: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 22px;

  z-index: 10;
}


/* AWAY */

#awayTens {
  left: 432px;
  top: 136px;
}

#awayOnes {
  left: 470px;
  top: 136px;
}


/* HOME */

#homeTens {
  left: 432px;
  top: 178px;
}

#homeOnes {
  left: 470px;
  top: 178px;
}


/* =============================
   OUTS
============================= */

.out-indicator {
  position: absolute;

  width: 15px;
  height: 15px;

  border-radius: 50%;

  background: #ffe600;

  display: none;

  z-index: 15;
}

#out1 {
  left: 518px;
  top: 190px;
}

#out2 {
  left: 537px;
  top: 190px;
}


/* =============================
   RUNNERS
============================= */

.runner {
  position: absolute;

  width: 25px;
  height: 25px;

  display: none;

  object-fit: contain;

  z-index: 15;
}

#runnerFirst {
  left: 685px;
  top: 128px;
}

#runnerSecond {
  left: 605px;
  top: 50px;
}

#runnerThird {
  left: 527px;
  top: 128px;
}

</style>
</head>

<body>

<div id="overlay">

  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt=""
  >

  <div id="half">
    TOP
  </div>

  <div id="inning">
    1
  </div>

  <div id="count">
    0-0
  </div>


  <!-- AWAY -->

  <div
    id="awayName"
    class="team-name">
    AWAY
  </div>

  <div
    id="awayTens"
    class="score-digit">
  </div>

  <div
    id="awayOnes"
    class="score-digit">
    0
  </div>


  <!-- HOME -->

  <div
    id="homeName"
    class="team-name">
    HOME
  </div>

  <div
    id="homeTens"
    class="score-digit">
  </div>

  <div
    id="homeOnes"
    class="score-digit">
    0
  </div>


  <!-- OUTS -->

  <div
    id="out1"
    class="out-indicator">
  </div>

  <div
    id="out2"
    class="out-indicator">
  </div>


  <!-- BASES -->

  <img
    id="runnerFirst"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >

  <img
    id="runnerSecond"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >

  <img
    id="runnerThird"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >

</div>


<script>

const SUPABASE_URL =
  "https://smaqspbeeouzgbwskbnx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AoFWsp2Dt_JzdrRm5bF8Tw_zdbOEs1x";

const GAME_CODE =
  "TEST001";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let game = null;


/* =============================
   LOAD GAME
============================= */

async function loadGame() {

  const { data, error } =
    await db
      .from("live_games")
      .select("*")
      .eq(
        "game_code",
        GAME_CODE
      )
      .single();

  if (error) {

    console.error(
      "Error loading game:",
      error
    );

    return;
  }

  game = data;

  render();
}


/* =============================
   SCORE DIGITS
============================= */

function renderScore(
  score,
  tensId,
  onesId
) {

  const value =
    Math.max(
      0,
      Number(score || 0)
    );

  const tens =
    Math.floor(value / 10);

  const ones =
    value % 10;


  document
    .getElementById(tensId)
    .textContent =
      tens > 0
        ? tens
        : "";


  document
    .getElementById(onesId)
    .textContent =
      ones;
}


/* =============================
   RENDER
============================= */

function render() {

  if (!game) return;


  /* TEAMS */

  document
    .getElementById("awayName")
    .textContent =
      game.away_team || "AWAY";

  document
    .getElementById("homeName")
    .textContent =
      game.home_team || "HOME";


  /* SCORES */

  renderScore(
    game.away_score,
    "awayTens",
    "awayOnes"
  );

  renderScore(
    game.home_score,
    "homeTens",
    "homeOnes"
  );


  /* HALF */

  document
    .getElementById("half")
    .textContent =
      game.inning_half === "bottom"
        ? "BOT"
        : "TOP";


  /* INNING */

  document
    .getElementById("inning")
    .textContent =
      game.inning ?? 1;


  /* COUNT */

  document
    .getElementById("count")
    .textContent =
      (game.balls ?? 0)
      + "-"
      + (game.strikes ?? 0);


  /* OUTS */

  const outs =
    Number(game.outs || 0);

  document
    .getElementById("out1")
    .style.display =
      outs >= 1
        ? "block"
        : "none";

  document
    .getElementById("out2")
    .style.display =
      outs >= 2
        ? "block"
        : "none";


  /* BASES */

  document
    .getElementById("runnerFirst")
    .style.display =
      game.runner_first
        ? "block"
        : "none";

  document
    .getElementById("runnerSecond")
    .style.display =
      game.runner_second
        ? "block"
        : "none";

  document
    .getElementById("runnerThird")
    .style.display =
      game.runner_third
        ? "block"
        : "none";
}


/* =============================
   REALTIME
============================= */

db
  .channel(
    "calzadilla-overlay-"
    + GAME_CODE
  )

  .on(

    "postgres_changes",

    {

      event: "UPDATE",

      schema: "public",

      table: "live_games",

      filter:
        "game_code=eq."
        + GAME_CODE

    },

    payload => {

      game =
        payload.new;

      render();

    }

  )

  .subscribe();


loadGame();

</script>

</body>
</html>
