<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calzadilla Live Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/supabase.production.js"></script>
  <script src="config/supabase.environment.js"></script>
  <script src="config/supabase.resolve.js"></script>

  <style>

    /* ================================
       BIGAIL FONT
    ================================= */

    @font-face {
      font-family: "Bigail";
      src: url("Bigail.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent !important;
    }

    #overlay {
      position: absolute;

      left: 20px;
      top: 20px;

      width: 746px;
      height: 283px;

      font-family: "Bigail", Arial, sans-serif;

      background: transparent;
    }


    /* ================================
       SCOREBOARD BACKGROUND
    ================================= */

    #scoreboardArt {
      position: absolute;

      left: 0;
      top: 0;

      width: 746px;
      height: 283px;

      pointer-events: none;

      z-index: 1;
    }


    /* ================================
       TOP / BOT
    ================================= */

    #half {
      position: absolute;

      left: 315px;
      top: 63px;

      width: 105px;
      height: 55px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #10266f;

      font-size: 40px;
      line-height: 1;

      white-space: nowrap;

      z-index: 10;
    }


    /* ================================
       INNING
    ================================= */

    #inning {
      position: absolute;

      left: 430px;
      top: 63px;

      width: 62px;
      height: 53px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #ffffff;

      font-size: 38px;
      line-height: 1;

      z-index: 10;
    }


    /* ================================
       BALL - STRIKE COUNT
    ================================= */

    #count {
      position: absolute;

      left: 498px;
      top: 69px;

      width: 75px;
      height: 42px;

      display: flex;
      justify-content: flex-start;
      align-items: center;

      color: #10266f;

      font-size: 26px;
      line-height: 1;

      white-space: nowrap;

      z-index: 10;
    }


    /* ================================
       TEAM NAMES
    ================================= */

    .team-name {
      position: absolute;

      width: 113px;
      height: 30px;

      display: flex;
      align-items: center;

      padding-left: 9px;

      color: #ffffff;

      font-size: 18px;
      line-height: 1;

      text-transform: uppercase;

      white-space: nowrap;
      overflow: hidden;

      z-index: 10;
    }


    /* AWAY: moved 2px down */

    #awayName {
      left: 311px;
      top: 136px;
    }


    /* HOME: moved 2px down */

    #homeName {
      left: 311px;
      top: 178px;
    }


    /* ================================
       SCORE DIGITS
    ================================= */

    .score-digit {
      position: absolute;

      width: 32px;
      height: 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #ffffff;

      font-size: 23px;
      line-height: 1;

      z-index: 10;
    }


    /* AWAY TENS: moved 2px down */

    #awayTens {
      left: 432px;
      top: 136px;
    }


    /* AWAY ONES: moved 2px down */

    #awayOnes {
      left: 470px;
      top: 136px;
    }


    /* HOME TENS: moved 2px down */

    #homeTens {
      left: 432px;
      top: 178px;
    }


    /* HOME ONES: moved 2px down */

    #homeOnes {
      left: 470px;
      top: 178px;
    }


    /* ================================
       OUT INDICATORS
    ================================= */

    .out-indicator {
      position: absolute;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: #ffe600;

      display: none;

      z-index: 20;
    }


    #out1 {
      left: 508px;
      top: 178px;
    }


    #out2 {
      left: 526px;
      top: 178px;
    }


    /* ================================
       RUNNERS
       DO NOT CHANGE
    ================================= */

    .runner {
      position: absolute;

      width: 25px;
      height: 25px;

      display: none;

      object-fit: contain;

      z-index: 20;
    }


    /* FIRST BASE */

    #runnerFirst {
      left: 685px;
      top: 128px;
    }


    /* SECOND BASE */

    #runnerSecond {
      left: 605px;
      top: 50px;
    }


    /* THIRD BASE */

    #runnerThird {
      left: 527px;
      top: 128px;
    }

  </style>
</head>


<body>


<div id="overlay">


  <!-- SCOREBOARD ART -->

  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt=""
  >


  <!-- TOP / BOTTOM -->

  <div id="half">
    TOP
  </div>


  <!-- INNING -->

  <div id="inning">
    1
  </div>


  <!-- BALL / STRIKE COUNT -->

  <div id="count">
    0-0
  </div>


  <!-- AWAY TEAM -->

  <div
    id="awayName"
    class="team-name">
    AWAY
  </div>


  <!-- AWAY SCORE -->

  <div
    id="awayTens"
    class="score-digit">
  </div>


  <div
    id="awayOnes"
    class="score-digit">
    0
  </div>


  <!-- HOME TEAM -->

  <div
    id="homeName"
    class="team-name">
    HOME
  </div>


  <!-- HOME SCORE -->

  <div
    id="homeTens"
    class="score-digit">
  </div>


  <div
    id="homeOnes"
    class="score-digit">
    0
  </div>


  <!-- OUTS -->

  <div
    id="out1"
    class="out-indicator">
  </div>


  <div
    id="out2"
    class="out-indicator">
  </div>


  <!-- BASE RUNNERS -->

  <img
    id="runnerFirst"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


  <img
    id="runnerSecond"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


  <img
    id="runnerThird"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


</div>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    window.CALZADILLA_SUPABASE_CONFIG.url;


  const SUPABASE_KEY =
    window.CALZADILLA_SUPABASE_CONFIG.anonKey;


  const GAME_CODE =
    "TEST001";


  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let game = null;



  /* ================================
     LOAD GAME
  ================================= */

  async function loadGame() {

    const { data, error } =
      await db
        .from("live_games")
        .select("*")
        .eq(
          "game_code",
          GAME_CODE
        )
        .single();


    if (error) {

      console.error(
        "Error loading game:",
        error
      );

      return;
    }


    game = data;

    render();

  }



  /* ================================
     SCORE FORMATTER
  ================================= */

  function renderScore(
    score,
    tensId,
    onesId
  ) {

    const value =
      Math.max(
        0,
        Math.floor(
          Number(score || 0)
        )
      );


    const tens =
      Math.floor(
        value / 10
      );


    const ones =
      value % 10;


    const tensElement =
      document.getElementById(
        tensId
      );


    const onesElement =
      document.getElementById(
        onesId
      );


    /*
      SCORE:

       0 = [ ] [0]
       1 = [ ] [1]
       9 = [ ] [9]
      10 = [1] [0]
      11 = [1] [1]
      25 = [2] [5]
    */


    if (value < 10) {

      tensElement.textContent = "";

    } else {

      tensElement.textContent =
        tens;

    }


    onesElement.textContent =
      ones;

  }



  /* ================================
     RENDER GAME
  ================================= */

  function render() {

    if (!game) return;



    /* ================================
       TEAM NAMES
    ================================= */

    document
      .getElementById(
        "awayName"
      )
      .textContent =
        game.away_team ||
        "AWAY";


    document
      .getElementById(
        "homeName"
      )
      .textContent =
        game.home_team ||
        "HOME";



    /* ================================
       SCORES
    ================================= */

    renderScore(
      game.away_score,
      "awayTens",
      "awayOnes"
    );


    renderScore(
      game.home_score,
      "homeTens",
      "homeOnes"
    );



    /* ================================
       TOP / BOT
    ================================= */

    const half =
      String(
        game.inning_half || "top"
      ).toLowerCase();


    document
      .getElementById(
        "half"
      )
      .textContent =

        half === "bottom"

          ? "BOT"

          : "TOP";



    /* ================================
       INNING
    ================================= */

    document
      .getElementById(
        "inning"
      )
      .textContent =
        game.inning ?? 1;



    /* ================================
       COUNT
    ================================= */

    const balls =
      Number(
        game.balls || 0
      );


    const strikes =
      Number(
        game.strikes || 0
      );


    document
      .getElementById(
        "count"
      )
      .textContent =
        balls +
        "-" +
        strikes;



    /* ================================
       OUTS
    ================================= */

    const outs =
      Number(
        game.outs || 0
      );


    document
      .getElementById(
        "out1"
      )
      .style.display =

        outs >= 1

          ? "block"

          : "none";


    document
      .getElementById(
        "out2"
      )
      .style.display =

        outs >= 2

          ? "block"

          : "none";



    /* ================================
       FIRST BASE
    ================================= */

    document
      .getElementById(
        "runnerFirst"
      )
      .style.display =

        game.runner_first

          ? "block"

          : "none";



    /* ================================
       SECOND BASE
    ================================= */

    document
      .getElementById(
        "runnerSecond"
      )
      .style.display =

        game.runner_second

          ? "block"

          : "none";



    /* ================================
       THIRD BASE
    ================================= */

    document
      .getElementById(
        "runnerThird"
      )
      .style.display =

        game.runner_third

          ? "block"

          : "none";

  }



  /* ================================
     SUPABASE REALTIME
  ================================= */

  db
    .channel(
      "calzadilla-overlay-" +
      GAME_CODE
    )

    .on(

      "postgres_changes",

      {

        event:
          "UPDATE",

        schema:
          "public",

        table:
          "live_games",

        filter:
          "game_code=eq." +
          GAME_CODE

      },

      payload => {

        game =
          payload.new;

        render();

      }

    )

    .subscribe();



  /* ================================
     START
  ================================= */

  loadGame();

</script>


</body>
</html>
