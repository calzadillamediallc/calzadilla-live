<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calzadilla Live Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    @font-face {
      font-family: "Bigail";
      src: url("Bigail.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent !important;
    }

    #overlay {
      position: absolute;

      left: 20px;
      top: 20px;

      width: 746px;
      height: 283px;

      font-family: "Bigail", Arial, sans-serif;

      background: transparent;
    }


    /* ========================================
       BACKGROUND ART
    ======================================== */

    #scoreboardArt {
      position: absolute;

      left: 0;
      top: 0;

      width: 746px;
      height: 283px;

      pointer-events: none;

      z-index: 1;
    }


    /* ========================================
       TOP / BOT
    ======================================== */

    #half {
      position: absolute;

      left: 318px;
      top: 70px;

      width: 62px;
      height: 37px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #10266f;

      font-size: 22px;
      line-height: 1;

      z-index: 10;
    }


    /* ========================================
       INNING
    ======================================== */

    #inning {
      position: absolute;

      left: 432px;
      top: 63px;

      width: 56px;
      height: 47px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      font-size: 32px;
      line-height: 1;

      z-index: 10;
    }


    /* ========================================
       COUNT
       0-0 / 3-2 etc.
    ======================================== */

    #count {
      position: absolute;

      left: 493px;
      top: 70px;

      width: 66px;
      height: 37px;

      display: flex;
      justify-content: flex-start;
      align-items: center;

      color: #10266f;

      font-size: 22px;
      line-height: 1;

      z-index: 10;
    }


    /* ========================================
       TEAM NAMES
    ======================================== */

    .team-name {
      position: absolute;

      width: 113px;
      height: 30px;

      display: flex;
      align-items: center;

      padding-left: 9px;

      color: white;

      font-size: 14px;

      line-height: 1;

      text-transform: uppercase;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      z-index: 10;
    }


    #awayName {
      left: 311px;
      top: 136px;
    }


    #homeName {
      left: 311px;
      top: 178px;
    }


    /* ========================================
       SCORE DIGITS
    ======================================== */

    .score-digit {
      position: absolute;

      width: 32px;
      height: 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      font-size: 23px;

      line-height: 1;

      z-index: 10;
    }


    /* AWAY - TENS */

    #awayTens {
      left: 432px;
      top: 136px;
    }


    /* AWAY - ONES */

    #awayOnes {
      left: 470px;
      top: 136px;
    }


    /* HOME - TENS */

    #homeTens {
      left: 432px;
      top: 178px;
    }


    /* HOME - ONES */

    #homeOnes {
      left: 470px;
      top: 178px;
    }


    /* ========================================
       OUTS
    ======================================== */

    .out-indicator {
      position: absolute;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: #ffe600;

      display: none;

      z-index: 20;
    }


    #out1 {
      left: 515px;
      top: 189px;
    }


    #out2 {
      left: 533px;
      top: 189px;
    }


    /* ========================================
       RUNNERS
    ======================================== */

    .runner {
      position: absolute;

      width: 25px;
      height: 25px;

      display: none;

      object-fit: contain;

      z-index: 20;
    }


    /* FIRST */

    #runnerFirst {
      left: 685px;
      top: 128px;
    }


    /* SECOND */

    #runnerSecond {
      left: 605px;
      top: 50px;
    }


    /* THIRD */

    #runnerThird {
      left: 527px;
      top: 128px;
    }

  </style>
</head>


<body>


<div id="overlay">


  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt=""
  >


  <!-- TOP / BOT -->

  <div id="half">
    TOP
  </div>


  <!-- INNING -->

  <div id="inning">
    1
  </div>


  <!-- COUNT -->

  <div id="count">
    0-0
  </div>


  <!-- AWAY -->

  <div
    id="awayName"
    class="team-name">
    AWAY
  </div>


  <div
    id="awayTens"
    class="score-digit">
  </div>


  <div
    id="awayOnes"
    class="score-digit">
    0
  </div>


  <!-- HOME -->

  <div
    id="homeName"
    class="team-name">
    HOME
  </div>


  <div
    id="homeTens"
    class="score-digit">
  </div>


  <div
    id="homeOnes"
    class="score-digit">
    0
  </div>


  <!-- OUTS -->

  <div
    id="out1"
    class="out-indicator">
  </div>


  <div
    id="out2"
    class="out-indicator">
  </div>


  <!-- RUNNERS -->

  <img
    id="runnerFirst"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


  <img
    id="runnerSecond"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


  <img
    id="runnerThird"
    class="runner"
    src="BOX BASES.png"
    alt=""
  >


</div>


<script>

  const SUPABASE_URL =
    "https://smaqspbeeouzgbwskbnx.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_AoFWsp2Dt_JzdrRm5bF8Tw_zdbOEs1x";


  const GAME_CODE =
    "TEST001";


  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let game = null;



  /* ========================================
     LOAD GAME
  ======================================== */

  async function loadGame() {

    const { data, error } =
      await db
        .from("live_games")
        .select("*")
        .eq(
          "game_code",
          GAME_CODE
        )
        .single();


    if (error) {

      console.error(
        "Error loading game:",
        error
      );

      return;
    }


    game = data;

    render();
  }



  /* ========================================
     SCORE
  ======================================== */

  function renderScore(
    score,
    tensId,
    onesId
  ) {

    const value =
      Math.max(
        0,
        Math.floor(
          Number(score || 0)
        )
      );


    const tens =
      Math.floor(
        value / 10
      );


    const ones =
      value % 10;


    const tensElement =
      document.getElementById(
        tensId
      );


    const onesElement =
      document.getElementById(
        onesId
      );


    /*
      0 - 9:

      [ ] [7]

      10:

      [1] [0]

      25:

      [2] [5]
    */


    if (value < 10) {

      tensElement.textContent =
        "";

    } else {

      tensElement.textContent =
        tens;
    }


    onesElement.textContent =
      ones;

  }



  /* ========================================
     RENDER
  ======================================== */

  function render() {

    if (!game) return;



    /* TEAMS */

    document
      .getElementById(
        "awayName"
      )
      .textContent =
        game.away_team ||
        "AWAY";


    document
      .getElementById(
        "homeName"
      )
      .textContent =
        game.home_team ||
        "HOME";



    /* SCORE */

    renderScore(
      game.away_score,
      "awayTens",
      "awayOnes"
    );


    renderScore(
      game.home_score,
      "homeTens",
      "homeOnes"
    );



    /* TOP / BOT */

    document
      .getElementById(
        "half"
      )
      .textContent =

        game.inning_half ===
        "bottom"

          ? "BOT"

          : "TOP";



    /* INNING */

    document
      .getElementById(
        "inning"
      )
      .textContent =
        game.inning ?? 1;



    /* COUNT */

    document
      .getElementById(
        "count"
      )
      .textContent =

        (game.balls ?? 0)

        +

        "-"

        +

        (game.strikes ?? 0);



    /* OUTS */

    const outs =
      Number(
        game.outs || 0
      );


    document
      .getElementById(
        "out1"
      )
      .style.display =

        outs >= 1

          ? "block"

          : "none";


    document
      .getElementById(
        "out2"
      )
      .style.display =

        outs >= 2

          ? "block"

          : "none";



    /* FIRST */

    document
      .getElementById(
        "runnerFirst"
      )
      .style.display =

        game.runner_first

          ? "block"

          : "none";



    /* SECOND */

    document
      .getElementById(
        "runnerSecond"
      )
      .style.display =

        game.runner_second

          ? "block"

          : "none";



    /* THIRD */

    document
      .getElementById(
        "runnerThird"
      )
      .style.display =

        game.runner_third

          ? "block"

          : "none";

  }



  /* ========================================
     REALTIME
  ======================================== */

  db
    .channel(
      "calzadilla-overlay-"
      +
      GAME_CODE
    )

    .on(

      "postgres_changes",

      {

        event:
          "UPDATE",

        schema:
          "public",

        table:
          "live_games",

        filter:
          "game_code=eq."
          +
          GAME_CODE

      },

      payload => {

        game =
          payload.new;

        render();

      }

    )

    .subscribe();



  /* ========================================
     START
  ======================================== */

  loadGame();

</script>


</body>
</html>
