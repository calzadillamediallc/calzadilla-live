
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calzadilla Live Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    /* =====================================================
       OVERLAY WRAPPER
    ===================================================== */

    #overlay {
      position: absolute;

      left: 20px;
      top: 20px;

      width: 746px;
      height: 283px;

      transform-origin: top left;

      background: transparent;
    }

    /* =====================================================
       SCOREBOARD ART
    ===================================================== */

    #scoreboardArt {
      position: absolute;

      left: 0;
      top: 0;

      width: 746px;
      height: 283px;

      object-fit: contain;

      pointer-events: none;
    }


    /* =====================================================
       TEAM NAMES
    ===================================================== */

    .team-name {
      position: absolute;

      width: 150px;

      color: #0d246a;

      font-size: 17px;
      font-weight: 900;

      text-transform: uppercase;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      text-align: left;
    }

    #awayName {
      left: 310px;
      top: 102px;
    }

    #homeName {
      left: 310px;
      top: 151px;
    }


    /* =====================================================
       SCORE
    ===================================================== */

    .score {
      position: absolute;

      width: 42px;

      text-align: center;

      color: #0d246a;

      font-size: 27px;
      font-weight: 900;

      line-height: 35px;
    }

    #awayScore {
      left: 455px;
      top: 92px;
    }

    #homeScore {
      left: 455px;
      top: 142px;
    }


    /* =====================================================
       INNING
    ===================================================== */

    #inning {
      position: absolute;

      left: 431px;
      top: 53px;

      width: 60px;

      text-align: center;

      color: #0d246a;

      font-size: 23px;
      font-weight: 900;
    }


    /* =====================================================
       COUNT
    ===================================================== */

    .count-value {
      position: absolute;

      color: #0d246a;

      font-size: 18px;
      font-weight: 900;

      text-align: center;
    }

    #balls {
      left: 459px;
      top: 101px;

      width: 30px;
    }

    #strikes {
      left: 459px;
      top: 151px;

      width: 30px;
    }


    /* =====================================================
       OUT DOTS
    ===================================================== */

    .out-dot {
      position: absolute;

      width: 15px;
      height: 15px;

      border-radius: 50%;

      background: #ffe000;

      display: none;

      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    #out1 {
      left: 510px;
      top: 178px;
    }

    #out2 {
      left: 529px;
      top: 178px;
    }


    /* =====================================================
       BASE RUNNERS
    ===================================================== */

    .runner-base {
      position: absolute;

      width: 24px;
      height: 24px;

      background: #ffe000;

      transform: rotate(45deg);

      display: none;

      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    /* 1B */
    #runnerFirst {
      left: 685px;
      top: 128px;
    }

    /* 2B */
    #runnerSecond {
      left: 606px;
      top: 49px;
    }

    /* 3B */
    #runnerThird {
      left: 527px;
      top: 128px;
    }


    /* =====================================================
       OPTIONAL STATUS
       Hidden during broadcast
    ===================================================== */

    #status {
      display: none;
    }


    /* =====================================================
       SCALE FOR SMALLER SCREENS
    ===================================================== */

    @media (max-width: 800px) {

      #overlay {
        transform: scale(.85);
      }

    }

  </style>
</head>

<body>


<div id="overlay">

  <!-- SCOREBOARD BASE DESIGN -->

  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt="">


  <!-- AWAY -->

  <div id="awayName" class="team-name">
    AWAY
  </div>

  <div id="awayScore" class="score">
    0
  </div>


  <!-- HOME -->

  <div id="homeName" class="team-name">
    HOME
  </div>

  <div id="homeScore" class="score">
    0
  </div>


  <!-- INNING -->

  <div id="inning">
    ▲1
  </div>


  <!-- COUNT -->

  <div id="balls" class="count-value">
    0
  </div>

  <div id="strikes" class="count-value">
    0
  </div>


  <!-- OUTS -->

  <div id="out1" class="out-dot"></div>
  <div id="out2" class="out-dot"></div>


  <!-- RUNNERS -->

  <div
    id="runnerFirst"
    class="runner-base">
  </div>

  <div
    id="runnerSecond"
    class="runner-base">
  </div>

  <div
    id="runnerThird"
    class="runner-base">
  </div>


  <div id="status"></div>

</div>


<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://smaqspbeeouzgbwskbnx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_AoFWsp2Dt_JzdrRm5bF8Tw_zdbOEs1x";

  const GAME_CODE =
    "TEST001";


  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let game = null;


  /* =====================================================
     LOAD GAME
  ===================================================== */

  async function loadGame() {

    const { data, error } =
      await db
        .from("live_games")
        .select("*")
        .eq(
          "game_code",
          GAME_CODE
        )
        .single();


    if (error) {

      console.error(error);

      return;
    }


    game = data;

    render();

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function render() {

    if (!game) return;


    /* -------------------------
       TEAM NAMES
    ------------------------- */

    document
      .getElementById("awayName")
      .textContent =
        game.away_team;


    document
      .getElementById("homeName")
      .textContent =
        game.home_team;


    /* -------------------------
       SCORE
    ------------------------- */

    document
      .getElementById("awayScore")
      .textContent =
        game.away_score;


    document
      .getElementById("homeScore")
      .textContent =
        game.home_score;


    /* -------------------------
       INNING
    ------------------------- */

    const inningArrow =
      game.inning_half === "top"
        ? "▲"
        : "▼";


    document
      .getElementById("inning")
      .textContent =
        inningArrow +
        game.inning;


    /* -------------------------
       BALLS / STRIKES
    ------------------------- */

    document
      .getElementById("balls")
      .textContent =
        game.balls;


    document
      .getElementById("strikes")
      .textContent =
        game.strikes;


    /* -------------------------
       OUTS
    ------------------------- */

    document
      .getElementById("out1")
      .style.display =
        game.outs >= 1
          ? "block"
          : "none";


    document
      .getElementById("out2")
      .style.display =
        game.outs >= 2
          ? "block"
          : "none";


    /* -------------------------
       RUNNERS
    ------------------------- */

    document
      .getElementById(
        "runnerFirst"
      )
      .style.display =
        game.runner_first
          ? "block"
          : "none";


    document
      .getElementById(
        "runnerSecond"
      )
      .style.display =
        game.runner_second
          ? "block"
          : "none";


    document
      .getElementById(
        "runnerThird"
      )
      .style.display =
        game.runner_third
          ? "block"
          : "none";

  }


  /* =====================================================
     REALTIME
  ===================================================== */

  db
    .channel(
      "calzadilla-overlay-"
      + GAME_CODE
    )

    .on(

      "postgres_changes",

      {

        event:
          "UPDATE",

        schema:
          "public",

        table:
          "live_games",

        filter:
          "game_code=eq."
          + GAME_CODE

      },

      payload => {

        game =
          payload.new;

        render();

      }

    )

    .subscribe();


  /* =====================================================
     START
  ===================================================== */

  loadGame();

</script>


</body>
</html>
