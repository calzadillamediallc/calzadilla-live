<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calzadilla Live Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
    }

    #overlay {
      position: absolute;
      left: 20px;
      top: 20px;

      width: 746px;
      height: 283px;

      background: transparent;
    }

    #scoreboardArt {
      position: absolute;
      inset: 0;

      width: 746px;
      height: 283px;

      object-fit: contain;
      pointer-events: none;
    }

    /* =========================
       TEAM NAMES
    ========================= */

    .team-name {
      position: absolute;

      width: 125px;

      color: #10266f;

      font-size: 13px;
      font-weight: 900;

      text-transform: uppercase;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      line-height: 28px;
    }

    #awayName {
      left: 218px;
      top: 86px;
    }

    #homeName {
      left: 218px;
      top: 135px;
    }

    /* =========================
       SCORE
    ========================= */

    .score {
      position: absolute;

      width: 33px;
      height: 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #10266f;

      font-size: 22px;
      font-weight: 900;
    }

    #awayScore {
      left: 437px;
      top: 87px;
    }

    #homeScore {
      left: 437px;
      top: 136px;
    }

    /* =========================
       INNING
    ========================= */

    #inning {
      position: absolute;

      left: 425px;
      top: 52px;

      width: 65px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #10266f;

      font-size: 21px;
      font-weight: 900;
    }

    /* =========================
       BALLS / STRIKES
    ========================= */

    .count-value {
      position: absolute;

      width: 35px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #10266f;

      font-size: 19px;
      font-weight: 900;
    }

    #balls {
      left: 438px;
      top: 106px;
    }

    #strikes {
      left: 438px;
      top: 155px;
    }

    /* =========================
       OUTS
    ========================= */

    .out-dot {
      position: absolute;

      width: 14px;
      height: 14px;

      border-radius: 50%;
      background: #ffe100;

      display: none;
    }

    #out1 {
      left: 510px;
      top: 177px;
    }

    #out2 {
      left: 529px;
      top: 177px;
    }

    /* =========================
       BASE RUNNERS
    ========================= */

    .runner-base {
      position: absolute;

      width: 17px;
      height: 17px;

      background: #ffe100;

      transform: rotate(45deg);

      display: none;

      box-shadow: 0 1px 3px rgba(0,0,0,.35);
    }

    /* 1B */
    #runnerFirst {
      left: 691px;
      top: 130px;
    }

    /* 2B */
    #runnerSecond {
      left: 610px;
      top: 49px;
    }

    /* 3B */
    #runnerThird {
      left: 529px;
      top: 130px;
    }
  </style>
</head>

<body>

<div id="overlay">

  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt="">

  <div id="awayName" class="team-name">
    AWAY
  </div>

  <div id="awayScore" class="score">
    0
  </div>

  <div id="homeName" class="team-name">
    HOME
  </div>

  <div id="homeScore" class="score">
    0
  </div>

  <div id="inning">
    ▲1
  </div>

  <div id="balls" class="count-value">
    0
  </div>

  <div id="strikes" class="count-value">
    0
  </div>

  <div id="out1" class="out-dot"></div>
  <div id="out2" class="out-dot"></div>

  <div id="runnerFirst" class="runner-base"></div>
  <div id="runnerSecond" class="runner-base"></div>
  <div id="runnerThird" class="runner-base"></div>

</div>

<script>

const SUPABASE_URL =
  "https://smaqspbeeouzgbwskbnx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AoFWsp2Dt_JzdrRm5bF8Tw_zdbOEs1x";

const GAME_CODE =
  "TEST001";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let game = null;


async function loadGame() {

  const { data, error } =
    await db
      .from("live_games")
      .select("*")
      .eq("game_code", GAME_CODE)
      .single();

  if (error) {
    console.error(error);
    return;
  }

  game = data;

  render();
}


function render() {

  if (!game) return;


  document.getElementById(
    "awayName"
  ).textContent =
    game.away_team;


  document.getElementById(
    "homeName"
  ).textContent =
    game.home_team;


  document.getElementById(
    "awayScore"
  ).textContent =
    game.away_score;


  document.getElementById(
    "homeScore"
  ).textContent =
    game.home_score;


  const arrow =
    game.inning_half === "top"
      ? "▲"
      : "▼";


  document.getElementById(
    "inning"
  ).textContent =
    arrow + game.inning;


  document.getElementById(
    "balls"
  ).textContent =
    game.balls;


  document.getElementById(
    "strikes"
  ).textContent =
    game.strikes;


  document.getElementById(
    "out1"
  ).style.display =
    game.outs >= 1
      ? "block"
      : "none";


  document.getElementById(
    "out2"
  ).style.display =
    game.outs >= 2
      ? "block"
      : "none";


  document.getElementById(
    "runnerFirst"
  ).style.display =
    game.runner_first
      ? "block"
      : "none";


  document.getElementById(
    "runnerSecond"
  ).style.display =
    game.runner_second
      ? "block"
      : "none";


  document.getElementById(
    "runnerThird"
  ).style.display =
    game.runner_third
      ? "block"
      : "none";
}


db
  .channel(
    "calzadilla-overlay-" +
    GAME_CODE
  )

  .on(
    "postgres_changes",

    {
      event: "UPDATE",
      schema: "public",
      table: "live_games",
      filter:
        "game_code=eq." +
        GAME_CODE
    },

    payload => {

      game =
        payload.new;

      render();
    }
  )

  .subscribe();


loadGame();

</script>

</body>
</html>
