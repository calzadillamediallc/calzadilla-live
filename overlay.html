<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calzadilla Live Overlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  font-family: Arial, Helvetica, sans-serif;
}

#overlay {
  position: absolute;
  left: 20px;
  top: 20px;

  width: 746px;
  height: 283px;

  background: transparent;
}


/* ========================================
   MAIN ART
======================================== */

#scoreboardArt {
  position: absolute;
  inset: 0;

  width: 746px;
  height: 283px;

  pointer-events: none;
}


/* ========================================
   TOP / BOTTOM
======================================== */

#half {
  position: absolute;

  left: 322px;
  top: 76px;

  width: 58px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #10266f;

  font-size: 17px;
  font-weight: 900;
}


/* ========================================
   COUNT — 2-1
======================================== */

#count {
  position: absolute;

  left: 378px;
  top: 76px;

  width: 48px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #10266f;

  font-size: 17px;
  font-weight: 900;
}


/* ========================================
   INNING
   BLUE BOX
======================================== */

#inning {
  position: absolute;

  left: 433px;
  top: 69px;

  width: 53px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 23px;
  font-weight: 900;
}


/* ========================================
   TEAM NAMES
======================================== */

.team-name {
  position: absolute;

  width: 112px;
  height: 30px;

  display: flex;
  align-items: center;

  color: white;

  font-size: 13px;
  font-weight: 900;

  padding-left: 9px;

  text-transform: uppercase;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* AWAY — TOP BLUE BAR */

#awayName {
  left: 311px;
  top: 136px;
}


/* HOME — BOTTOM BLUE BAR */

#homeName {
  left: 311px;
  top: 178px;
}


/* ========================================
   SCORES
======================================== */

.score {
  position: absolute;

  width: 32px;
  height: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 21px;
  font-weight: 900;
}


/* AWAY SCORE */

#awayScore {
  left: 432px;
  top: 136px;
}


/* HOME SCORE */

#homeScore {
  left: 432px;
  top: 178px;
}


/* ========================================
   OUTS
======================================== */

.out-indicator {
  position: absolute;

  width: 17px;
  height: 17px;

  display: none;
}


/* first circle */

#out1 {
  left: 508px;
  top: 176px;
}


/* second circle */

#out2 {
  left: 527px;
  top: 176px;
}


/* ========================================
   BASE RUNNERS
======================================== */

.runner {
  position: absolute;

  width: 25px;
  height: 25px;

  display: none;
}


/* SECOND BASE */

#runnerSecond {
  left: 605px;
  top: 50px;
}


/* THIRD BASE */

#runnerThird {
  left: 527px;
  top: 128px;
}


/* FIRST BASE */

#runnerFirst {
  left: 685px;
  top: 128px;
}

</style>
</head>


<body>

<div id="overlay">

  <!-- MAIN SCOREBOARD -->

  <img
    id="scoreboardArt"
    src="BOX SCORE 2026.png"
    alt="">


  <!-- TOP / BOTTOM -->

  <div id="half">
    TOP
  </div>


  <!-- COUNT -->

  <div id="count">
    0-0
  </div>


  <!-- INNING -->

  <div id="inning">
    1
  </div>


  <!-- AWAY -->

  <div
    id="awayName"
    class="team-name">
    AWAY
  </div>

  <div
    id="awayScore"
    class="score">
    0
  </div>


  <!-- HOME -->

  <div
    id="homeName"
    class="team-name">
    HOME
  </div>

  <div
    id="homeScore"
    class="score">
    0
  </div>


  <!-- OUTS -->

  <img
    id="out1"
    class="out-indicator"
    src="BOX OUT.png">

  <img
    id="out2"
    class="out-indicator"
    src="BOX OUT.png">


  <!-- RUNNERS -->

  <img
    id="runnerFirst"
    class="runner"
    src="BOX BASES.png">

  <img
    id="runnerSecond"
    class="runner"
    src="BOX BASES.png">

  <img
    id="runnerThird"
    class="runner"
    src="BOX BASES.png">

</div>


<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://smaqspbeeouzgbwskbnx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AoFWsp2Dt_JzdrRm5bF8Tw_zdbOEs1x";

const GAME_CODE =
  "TEST001";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let game = null;


/* ========================================
   LOAD
======================================== */

async function loadGame() {

  const { data, error } =
    await db
      .from("live_games")
      .select("*")
      .eq(
        "game_code",
        GAME_CODE
      )
      .single();


  if (error) {

    console.error(error);

    return;
  }


  game = data;

  render();
}


/* ========================================
   RENDER
======================================== */

function render() {

  if (!game) return;


  /* TEAMS */

  document
    .getElementById("awayName")
    .textContent =
      game.away_team;


  document
    .getElementById("homeName")
    .textContent =
      game.home_team;


  /* SCORES */

  document
    .getElementById("awayScore")
    .textContent =
      game.away_score;


  document
    .getElementById("homeScore")
    .textContent =
      game.home_score;


  /* TOP / BOTTOM */

  document
    .getElementById("half")
    .textContent =
      game.inning_half === "top"
        ? "TOP"
        : "BOT";


  /* INNING */

  document
    .getElementById("inning")
    .textContent =
      game.inning;


  /* COUNT */

  document
    .getElementById("count")
    .textContent =
      game.balls
      + "-"
      + game.strikes;


  /* OUTS */

  document
    .getElementById("out1")
    .style.display =
      game.outs >= 1
        ? "block"
        : "none";


  document
    .getElementById("out2")
    .style.display =
      game.outs >= 2
        ? "block"
        : "none";


  /* FIRST */

  document
    .getElementById("runnerFirst")
    .style.display =
      game.runner_first
        ? "block"
        : "none";


  /* SECOND */

  document
    .getElementById("runnerSecond")
    .style.display =
      game.runner_second
        ? "block"
        : "none";


  /* THIRD */

  document
    .getElementById("runnerThird")
    .style.display =
      game.runner_third
        ? "block"
        : "none";

}


/* ========================================
   REALTIME
======================================== */

db
  .channel(
    "calzadilla-overlay-"
    + GAME_CODE
  )

  .on(

    "postgres_changes",

    {
      event: "UPDATE",

      schema: "public",

      table: "live_games",

      filter:
        "game_code=eq."
        + GAME_CODE
    },

    payload => {

      game =
        payload.new;

      render();

    }

  )

  .subscribe();


/* ========================================
   START
======================================== */

loadGame();

</script>

</body>
</html>
